<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Trainer</title><style>body{margin:0;background:#070b15;color:#eef4ff;font:15px system-ui}.app{max-width:1000px;margin:auto;padding:18px}.box{background:#101a30;border:1px solid #40557c;border-radius:14px;padding:16px;margin:12px 0}button,select{background:#243b6a;color:white;border:1px solid #86a9e8;border-radius:8px;padding:9px;margin:3px}button:disabled{opacity:.4}#stage{height:340px;background:radial-gradient(circle,#345b9a55,transparent 45%),#070d19;border-radius:12px;position:relative;overflow:hidden}canvas{width:100%;height:100%}.grid{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px}.bar{height:9px;background:#050812;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#75b5ff,#d889ff,#ffe49a)}.card{padding:8px;border:1px solid #3c5075;border-radius:9px;margin:6px 0;cursor:pointer}.sel{border-color:#ffe49a}.lock{opacity:.45}.big{text-align:center;font-size:32px;font-weight:900}.muted{color:#aab9d6;font-size:12px}.hold{width:100%;font-weight:900;padding:14px}.on{background:#8155d6!important;box-shadow:0 0 25px #8cbaff}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><h1>🌙 Aura Trainer — Grimoire of Control</h1><div class="box"><button id="fm">Frieren Mode</button><button id="fn">Fern Mode</button> <b id="lv"></b> <span id="xp"></span></div><div class="grid"><div class="box"><h3>Vessel</h3><div id="v" style="height:180px;background:#091225;border-radius:10px"></div><label>Name <input id="name"></label><br><label>Aura <select id="aura"><option>#8bbcff</option><option>#c482ff</option><option>#62e3b0</option><option>#ffd46f</option></select></label><p class="muted">The vessel reflects the same inward, outward, forward, grounding, escaping, and circulating flow as the field.</p></div><div class="box"><h3 id="en"></h3><div id="stage"><canvas id="c"></canvas><div style="position:absolute;inset:15px;text-align:center"><div id="flow"></div><div class="big" id="time"></div><b id="prompt"></b><div class="muted" id="sub"></div><div style="margin-top:8px" id="acc"></div></div></div><button id="start">Begin Training</button><button id="pause" disabled>Pause</button><button id="end" disabled>End</button><button class="hold" id="hold">HOLD TO CONTAIN / CHANNEL</button></div><div class="box"><h3>Grimoire</h3><div id="stats"></div><h4>Recommendation</h4><div id="rec"></div><h4>Exercises</h4><div id="cards"></div><h4>Report</h4><pre id="report" style="white-space:pre-wrap"></pre></div></div></div><script>
const K='aura-retained-v3',B={name:'Trainee',level:1,xp:0,mode:'fern',aura:'#8bbcff',stats:{focus:20,discipline:18,aura:15,density:15,defense:10,capacity:18},mastery:{},history:[]};let P;try{P={...B,...JSON.parse(localStorage[K]),stats:{...B.stats,...JSON.parse(localStorage[K]).stats}}}catch{P=structuredClone(B)};let id='supp',run=0,hold=0,at=0,el=0,sc=0,n=0,leak=0,tid;
const E=[['supp','Mana Suppression',1,4,1.5,'aura','suppression'],['zol','Zoltraak Focus',1,5,1.5,'focus','beam'],['cons','Aura Conservation',2,6,2,'aura','leak'],['reg','Aura Regulation',3,8,2.5,'discipline','breath'],['def','Defensive Magic',4,5,1.5,'defense','barrier'],['perfect','Perfect Control',5,10,3,'density','perfect'],['adv','Advanced Barrier',6,7,2,'defense','barrier'],['sol','Sanctuary of Sol',8,9,2.5,'capacity','sanctuary']].map(x=>({id:x[0],name:x[1],u:x[2],f:x[3],fe:x[4],stat:x[5],type:x[6]}));const q=s=>document.querySelector(s),e=()=>E.find(x=>x.id==id),dur=x=>P.mode==='fern'?x.fe:x.f,rank=()=>P.level>=8?'First Class Mage':P.level>=5?'Battle Mage':P.level>=3?'Adept Mage':'Apprentice';function save(){localStorage[K]=JSON.stringify(P)}function rec(){return E.filter(x=>x.u<=P.level).sort((a,b)=>P.stats[a.stat]-P.stats[b.stat])[0]}function render(){q('#name').value=P.name;q('#aura').value=P.aura;q('#lv').textContent='Lv. '+P.level+' • '+rank();q('#xp').textContent=P.xp+'/100 XP';q('#en').textContent=e().name+' • '+dur(e())+' min';q('#cards').innerHTML=E.map(x=>`<div class="card ${id==x.id?'sel':''} ${P.level<x.u?'lock':''}" onclick="pick('${x.id}')"><b>${x.name}</b><div class="muted">${P.level<x.u?'Unlock Lv. '+x.u:dur(x)+' min ready'}</div></div>`).join('');q('#stats').innerHTML=Object.entries(P.stats).map(([k,v])=>`<div>${k}: <b>${v}</b><div class="bar"><i style="width:${v}%"></i></div></div>`).join('');let r=rec();q('#rec').innerHTML=`<b>${r.name}</b><div class="muted">Lowest adaptive stat: ${r.stat}. Train ${dur(r)} min in ${P.mode} mode.</div><button onclick="pick('${r.id}')">Use</button>`;if(!run){q('#time').textContent=fmt(dur(e())*60);q('#prompt').textContent='Select a spell, then begin training.'}save()}window.pick=x=>{if(!run&&E.find(z=>z.id==x).u<=P.level){id=x;render()}};function fmt(x){x=Math.ceil(Math.max(0,x));return String(x/60|0).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function state(){let x=e(),p=(el%(P.mode==='fern'?7:14))/(P.mode==='fern'?7:14);if(x.type==='breath')return p<.29?'INHALE • HOLD':p<.43?'HOLD • RELEASE':p<.86?'EXHALE • RELEASE':'GROUND • RELEASE';if(x.type==='suppression')return'RELEASE • SUPPRESS';if(x.type==='beam')return'HOLD • FORWARD CHANNEL';if(x.type==='leak')return leak?'HOLD • RETURN LEAK':'RELEASE • CIRCULATE';if(x.type==='barrier'||x.type==='sanctuary')return leak?'HOLD • DEPLOY BARRIER':'RELEASE • RECOVER';return hold?'HOLD • STABILIZE':'RELEASE • RESET'}function want(){return state().includes('HOLD')}function start(){run=1;at=Date.now();el=sc=n=0;leak=0;q('#start').disabled=1;q('#pause').disabled=0;q('#end').disabled=0;tid=setInterval(tick,100)}function tick(){el=(Date.now()-at)/1000;let x=e();if(['leak','barrier','sanctuary'].includes(x.type)&&!leak&&Math.random()<.02)leak=1;if(leak&&hold)leak=0;let good=hold===want();sc+=good?1:want()&&hold?0:.25;n++;let a=sc/n*100;q('#time').textContent=fmt(dur(x)*60-el);q('#flow').textContent=state();q('#prompt').textContent=leak?'⚠ MANA LEAK / ZOLTRAAK — HOLD NOW':good?'✓ Flow aligned':'Adjust input to match the flow';q('#acc').textContent='Continuous Accuracy: '+a.toFixed(1)+'%';if(P.mode==='fern'&&leak&&!hold){setTimeout(()=>{if(leak)finish(1)},820)}if(el>=dur(x)*60)finish(0)}function finish(fail){if(!run)return;clearInterval(tid);run=0;let a=sc/n*100,x=e(),pass=!fail&&(P.mode==='fern'?a>=85:a>=60),gain=pass?Math.max(1,Math.round(a/35)):0,xp=pass?Math.round((el/60)*10*(.6+.9*a/100)*(P.mode==='fern'?1.5:1)):0;if(pass){P.xp+=xp;P.stats[x.stat]+=gain;while(P.xp>=100){P.xp-=100;P.level++}}let m=P.mastery[x.id]||{attempts:0,best:0};m.attempts++;m.best=Math.max(m.best,a);P.mastery[x.id]=m;q('#report').textContent=`${x.name}
Mode: ${P.mode}
Continuous accuracy: ${a.toFixed(1)}%
${pass?'XP +'+xp+' • '+x.stat+' +'+gain:'Needs practice / failed threshold'}
Adaptive mastery: ${m.attempts} attempts, best ${m.best.toFixed(1)}%`;q('#start').disabled=0;q('#pause').disabled=1;q('#end').disabled=1;render()}q('#start').onclick=start;q('#end').onclick=()=>finish(0);q('#pause').onclick=()=>{run=!run;q('#pause').textContent=run?'Pause':'Resume';if(run)at=Date.now()-el*1000};q('#fm').onclick=()=>{if(!run){P.mode='frieren';render()}};q('#fn').onclick=()=>{if(!run){P.mode='fern';render()}};q('#name').oninput=x=>{P.name=x.target.value;save()};q('#aura').onchange=x=>{P.aura=x.target.value;save()};function set(v){hold=v;q('#hold').classList.toggle('on',v)}q('#hold').onpointerdown=()=>set(1);window.onpointerup=()=>set(0);window.onkeydown=x=>x.code==='Space'&&(x.preventDefault(),set(1));window.onkeyup=x=>x.code==='Space'&&set(0);const c=q('#c'),g=c.getContext('2d');function draw(t){let w=c.width=c.clientWidth,h=c.height=c.clientHeight,x=w/2,y=h*.57,a=P.aura,s=run?sc/Math.max(n,1):1,dir=state(),R=90+(dir.includes('INHALE')?-25:dir.includes('EXHALE')?25:0);let z=g.createRadialGradient(x,y,5,x,y,R*2);z.addColorStop(0,a+'a0');z.addColorStop(1,'transparent');g.fillStyle=z;g.fillRect(0,0,w,h);g.strokeStyle=a;g.lineWidth=2;for(let j=0;j<3;j++){g.beginPath();g.arc(x,y,R+j*23,0,7);g.stroke()}for(let i=0;i<28;i++){let ang=t/900+i,rr=R+(dir.includes('INHALE')?110-(t/20+i*11)%110:(t/20+i*11)%110);g.fillStyle=a;g.beginPath();g.arc(x+Math.cos(ang)*rr,y+Math.sin(ang)*rr,2,0,7);g.fill()}if(dir.includes('FORWARD')){g.strokeStyle='#eef6ff';g.lineWidth=hold?8:3;g.beginPath();g.moveTo(x,y);g.lineTo(x,y-190);g.stroke()}if(dir.includes('BARRIER')){g.strokeStyle=hold?a:'#ff6378';g.lineWidth=4;g.beginPath();g.arc(x,y,hold?130:80,0,7);g.stroke()}g.fillStyle='#f5f8ff';g.beginPath();g.arc(x,y-26,16,0,7);g.fill();g.strokeStyle='#6f9ce7';g.lineWidth=18;g.beginPath();g.moveTo(x,y-10);g.lineTo(x,y+44);g.stroke();requestAnimationFrame(draw)}requestAnimationFrame(draw);render();</script></body></html>
